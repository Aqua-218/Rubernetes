apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: k6-fake-store
spec:
  provider:
    fake:
      data:
        - key: k6-smoke
          value: expected
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k6-smoke
spec:
  secretStoreRef:
    kind: SecretStore
    name: k6-fake-store
  target:
    name: k6-smoke
  data:
    - secretKey: value
      remoteRef:
        key: k6-smoke
