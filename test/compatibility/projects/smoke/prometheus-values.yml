server:
  statefulSet:
    enabled: true
    pvcDeleteOnStsDelete: true
    pvcDeleteOnStsScale: true
  # Stock hostPath does not set fsGroup on a provisioned directory.
  extraInitContainers:
    - name: fixture-storage-permissions
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
      command: ["/bin/sh", "-ec", "chown 65534:65534 /fixture-data"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: storage-volume
          mountPath: /fixture-data
alertmanager:
  extraInitContainers:
    - name: fixture-storage-permissions
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
      command: ["/bin/sh", "-ec", "chown 65534:65534 /fixture-data"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: storage
          mountPath: /fixture-data
prometheus-node-exporter:
  # The fixture's workers share one VM host network. Keep host mounts and
  # host PID collection, and give each exporter its own pod network address.
  hostNetwork: false
