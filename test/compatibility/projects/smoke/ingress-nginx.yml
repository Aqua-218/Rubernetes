apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-http
spec:
  selector:
    matchLabels:
      app: k6-http
  template:
    metadata:
      labels:
        app: k6-http
    spec:
      containers:
        - name: httpd
          image: docker.io/library/httpd:2.4-alpine@sha256:32bd0639bcc4917ef1fd9363a1d9dd2dd9c498565118b062a10d51e43a5c3a24
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: k6-http
spec:
  selector:
    app: k6-http
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k6-http
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k6-http
                port:
                  number: 80
