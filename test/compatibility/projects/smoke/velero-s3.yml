apiVersion: v1
kind: Pod
metadata:
  name: k6-s3
  labels:
    app.kubernetes.io/name: k6-s3
spec:
  containers:
    - name: seaweedfs
      image: docker.io/chrislusf/seaweedfs:4.36@sha256:800b2115c63236e8bd0e5d572dc25dd493dc2feed08b54a2a269dc0101c9d94a
      args: [mini, -dir=/data]
      ports:
        - name: s3
          containerPort: 8333
      env:
        - name: S3_BUCKET
          value: velero
      envFrom:
        - secretRef:
            name: velero-k6-s3
      readinessProbe:
        tcpSocket:
          port: s3
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: k6-s3
spec:
  selector:
    app.kubernetes.io/name: k6-s3
  ports:
    - name: s3
      port: 8333
      targetPort: s3
