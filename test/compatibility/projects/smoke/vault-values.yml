server:
  updateStrategyType: RollingUpdate
  readinessProbe:
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
  # The disposable K6 cluster provisions HostPath volumes. Its kubelet
  # plugin leaves the provisioner's root-owned directory permissions intact.
  extraInitContainers:
    - name: fixture-volume-permissions
      image: hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
      command: ["/bin/sh", "-ec", "chown 100:1000 /vault/data"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: data
          mountPath: /vault/data
