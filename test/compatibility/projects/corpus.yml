      - ciliumidentities.cilium.io
      - ciliuml2announcementpolicies.cilium.io
      - ciliumloadbalancerippools.cilium.io
      - ciliumlocalredirectpolicies.cilium.io
      - ciliumnetworkpolicies.cilium.io
      - ciliumnodeconfigs.cilium.io
      - ciliumnodes.cilium.io
      - ciliumpodippools.cilium.io
    images:
      - quay.io/cilium/cilium-envoy:v1.37.5-1786810558-766ccfb37260a43e9d228837aa84ce3faf9f64e7@sha256:75b8094c7127736a2ffd2dce3945e0931cb6df21b0372ff661940eca26730b91
      - quay.io/cilium/cilium:v1.20.1@sha256:ae9ea21f7427fe24bc6ea7247eb552157a1b0a431744045d3f641545ca71d11b
      - quay.io/cilium/operator-generic:v1.20.1@sha256:6c3885fc7b629099fdbe2a5c87869c86feb825fa18fae299eac0f61918d16ecf
      - registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
    # The dedicated, one-worker QEMU fixture supplies a guest API port and
    # Cilium's CNI configuration directory. Leave kube-proxy in use.
    install: >-
      helm upgrade --install cilium cilium/cilium --version 1.20.1
      --namespace "$K6_NAMESPACE" --create-namespace
      --values "${RUBERNETES_K6_CILIUM_VALUES:?requires the dedicated QEMU guest fixture}"
      --set k8sServiceHost=127.0.0.1 --set-string "k8sServicePort=${RUBERNETES_K6_CILIUM_API_PORT:?}"
      --wait --timeout 15m
    ready: "bash test/compatibility/projects/smoke/cilium.sh ready"
    smoke_reference: "https://docs.cilium.io/en/stable/installation/k8s-install-helm/"
    smoke: "bash test/compatibility/projects/smoke/cilium.sh traffic"
    after_smoke: "bash test/compatibility/projects/smoke/cilium.sh cleanup"
    # The host-network operator and its health port are exclusive to a node.
    # This single-worker guest scales the actual operator down then back up.
    scale: "kubectl -n \"$K6_NAMESPACE\" scale deployment/cilium-operator --replicas=0"
    scale_targets: [deployment/cilium-operator]
    upgrade: >-
      helm upgrade cilium cilium/cilium --version 1.20.1
      --namespace "$K6_NAMESPACE" --reuse-values
      --set-string "k8sServicePort=${RUBERNETES_K6_CILIUM_API_PORT:?}" --wait --timeout 15m
    rollback: "bash test/compatibility/projects/smoke/cilium.sh rollback"
    restart: "kubectl -n \"$K6_NAMESPACE\" rollout restart deploy --all || true"
    uninstall: >-
      helm uninstall cilium --namespace "$K6_NAMESPACE" --wait --timeout 10m
      && bash test/compatibility/projects/smoke/cilium.sh release-cni-state;
      kubectl delete namespace "$K6_NAMESPACE" --ignore-not-found --timeout=10m
