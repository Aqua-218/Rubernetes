# K6 existing-project corpus (spec/verification/kubernetes-compatibility.md#k6).
#
# Every entry is a real upstream release that documents Kubernetes v1.36
# support.  Chart packages are pinned by the SHA-256 of the archive actually
# pulled, and every container image is pinned by the digest the registry
# returned, so a run cannot drift onto a mutable tag.  No template, manifest,
# source, image or webhook configuration carries a Rubernetes-specific patch:
# the install command is the project's own documented procedure.
# source_tag records the upstream application release, or the exact chart
# release in chart-only repositories. source_commit is the peeled Git commit.
#
# A finite corpus never proves "every project" works; per the spec this lane
# is an independent check of composite usage paths, while the primary
# evidence for full compatibility is the K3/K5 external contract ledger.
schema_version: 1
verified_at: "2026-09-07"
kubernetes_target: v1.36.2
# Helm repositories behind the chart aliases above.  The runner adds them
# under exactly these names and verifies every pulled package against
# chart_sha256 before any install command runs.
repositories:
  argo: https://argoproj.github.io/argo-helm
  cilium: https://helm.cilium.io/
  cnpg: https://cloudnative-pg.github.io/charts
  elastic: https://helm.elastic.co
  external-secrets: https://charts.external-secrets.io
  fluxcd: https://fluxcd-community.github.io/helm-charts
  gatekeeper: https://open-policy-agent.github.io/gatekeeper/charts
  grafana: https://grafana.github.io/helm-charts
  harbor: https://helm.goharbor.io
  hashicorp: https://helm.releases.hashicorp.com
  ingress-nginx: https://kubernetes.github.io/ingress-nginx
  istio: https://istio-release.storage.googleapis.com/charts
  jaegertracing: https://jaegertracing.github.io/helm-charts
  jetstack: https://charts.jetstack.io
  kedacore: https://kedacore.github.io/charts
  kyverno: https://kyverno.github.io/kyverno/
  longhorn: https://charts.longhorn.io
  mariadb-operator: https://helm.mariadb.com/mariadb-operator
  metrics-server: https://kubernetes-sigs.github.io/metrics-server/
  minio-operator: https://operator.min.io
  nats: https://nats-io.github.io/k8s/helm/charts/
  open-telemetry: https://open-telemetry.github.io/opentelemetry-helm-charts
