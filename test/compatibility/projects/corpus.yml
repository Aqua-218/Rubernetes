# K6 existing-project corpus (spec/verification/kubernetes-compatibility.md#k6).
#
# Every entry is a real upstream release that documents Kubernetes v1.36
# support.  Chart packages are pinned by the SHA-256 of the archive actually
# pulled, and every container image is pinned by the digest the registry
# returned, so a run cannot drift onto a mutable tag.  No template, manifest,
# source, image or webhook configuration carries a Rubernetes-specific patch:
# the install command is the project's own documented procedure.
#
# A finite corpus never proves "every project" works; per the spec this lane
# is an independent check of composite usage paths, while the primary
# evidence for full compatibility is the K3/K5 external contract ledger.
schema_version: 1
verified_at: "2026-09-07"
kubernetes_target: v1.36.2
# Helm repositories behind the chart aliases above.  The runner adds them
# under exactly these names and verifies every pulled package against
# chart_sha256 before any install command runs.
