\* Apalache configuration: the safety invariants of RuntimeLifecycle.cfg without the
\* temporal PROPERTY. Apalache does not model weak/strong fairness, so the liveness
\* property EventuallyStoppedOrRemoved is checked by TLC over the complete state space.
CONSTANTS
  ResourceIds = {"mount", "ns", "cgroup", "process", "pidfd", "temp"}

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ActiveResourceInvariant
  IdentityNonReuseInvariant
  CleanupOrderInvariant
  LiveOwnerInvariant
  RunningInvariant
  DigestMismatchInvariant
  WorkloadStoppedInvariant
  UnknownInvariant
  StoppedInvariant
  RemovedInvariant

