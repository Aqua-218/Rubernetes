# Default rules for a Rubernetes cluster (Prometheus rule-file format).
# Point DASHBOARD_RULES at another file to replace them.
groups:
- name: rubernetes.targets
  rules:
  - alert: TargetDown
    expr: up == 0
    for: 2m
    labels: { severity: critical }
    annotations:
      summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
      description: "The scrape target {{ $labels.instance }} of job {{ $labels.job }} has been unreachable for more than 2 minutes."
  - record: job:up:avg
    expr: avg by (job) (up)

- name: rubernetes.nodes
  rules:
  - alert: NodeNotReady
    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
    for: 3m
    labels: { severity: critical }
    annotations:
      summary: "Node {{ $labels.node }} is not Ready"
  - alert: NodeMemoryPressure
    expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
    for: 5m
    labels: { severity: warning }
    annotations:
      summary: "Node {{ $labels.node }} reports MemoryPressure"
  - alert: NodeDiskPressure
    expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
    for: 5m
    labels: { severity: warning }
    annotations:
      summary: "Node {{ $labels.node }} reports DiskPressure"

- name: rubernetes.workloads
  rules:
  - alert: PodCrashLooping
    expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
    for: 5m
    labels: { severity: warning }
    annotations:
      summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is restarting"
      description: "{{ printf \"%.0f\" $value }} restarts in the last 15 minutes."
  - alert: PodNotReady
    expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for 15 minutes"
  - alert: DeploymentReplicasMismatch
    expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched its desired replicas for 15 minutes"
  - alert: StatefulSetReplicasMismatch
    expr: kube_statefulset_spec_replicas != kube_statefulset_status_replicas_ready
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has not matched its desired replicas for 15 minutes"
  - alert: JobFailed
    expr: kube_job_failed{condition="true"} == 1
    labels: { severity: warning }
    annotations:
      summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
  - alert: PersistentVolumeClaimPending
    expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending"

- name: rubernetes.apiserver
  rules:
  - record: apiserver:request:rate5m
    expr: sum by (verb, code) (rate(apiserver_request_total[5m]))
  - alert: APIServerErrorBudgetBurn
    expr: |
      sum(rate(apiserver_request_total{code=~"5.."}[5m]))
        / sum(rate(apiserver_request_total[5m])) > 0.05
    for: 10m
    labels: { severity: critical }
    annotations:
      summary: "More than 5% of API server requests are failing with 5xx"
      description: "{{ humanizePercentage $value }} of requests failed over the last 5 minutes."
  - alert: APIServerLatencyHigh
    expr: |
      histogram_quantile(0.99, sum by (le, verb) (rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|CONNECT"}[5m]))) > 1
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "API server p99 latency for {{ $labels.verb }} is above 1s"
      description: "p99 is {{ humanizeDuration $value }}."
