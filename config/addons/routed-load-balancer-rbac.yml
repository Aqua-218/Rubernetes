apiVersion: v1
kind: List
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: rubernetes:routed-load-balancer
    rules:
      - apiGroups: [""]
        resources: [services]
        verbs: [get, list, update]
      - apiGroups: [""]
        resources: [services/status]
        verbs: [update]
      - apiGroups: ["", events.k8s.io]
        resources: [events]
        verbs: [create, patch, update]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: rubernetes:routed-load-balancer
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: rubernetes:routed-load-balancer
    subjects:
      - kind: ServiceAccount
        name: service-lb-controller
        namespace: kube-system
      - kind: User
        apiGroup: rbac.authorization.k8s.io
        name: system:kube-controller-manager
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: rubernetes:routed-load-balancer
      namespace: kube-system
    rules:
      - apiGroups: [""]
        resources: [configmaps]
        resourceNames: [rubernetes-load-balancer-allocations]
        verbs: [get, update]
      - apiGroups: [""]
        resources: [configmaps]
        verbs: [create]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: rubernetes:routed-load-balancer
      namespace: kube-system
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: rubernetes:routed-load-balancer
    subjects:
      - kind: ServiceAccount
        name: service-lb-controller
        namespace: kube-system
      - kind: User
        apiGroup: rbac.authorization.k8s.io
        name: system:kube-controller-manager
