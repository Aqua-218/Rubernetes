apiVersion: v1
kind: List
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: rubernetes:network-policy-reader
    rules:
      - apiGroups: [""]
        resources: [namespaces, pods]
        verbs: [list, watch]
      - apiGroups: [networking.k8s.io]
        resources: [networkpolicies]
        verbs: [list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: rubernetes:network-policy-reader
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: rubernetes:network-policy-reader
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: rubernetes:network-policy-reader
