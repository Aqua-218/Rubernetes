
# RuboCop: strict layout and style for readability; size metrics stay off
# (they measure design, not formatting) and remaining historical offenses
# live in .rubocop_todo.yml, to be burned down.
plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "build/**/*"
    - "tmp/**/*"
    - "artifacts/**/*"
    - "pkg/**/*"
    - "vendor/**/*"
    - ".bundle/**/*"
    - "a11-generated.*/**/*"
    - "apps/*/node_modules/**/*"
    - "apps/*/tmp/**/*"
    - "apps/*/log/**/*"
    - "apps/*/storage/**/*"
    - "apps/*/db/schema.rb"
    - "apps/*/bin/*"
    - "lib/**/generated/*_pb.rb"
    - "lib/**/*_pb.rb"
    - "lib/**/*_services_pb.rb"
    - "generated/**/*"

Layout/LineLength:
  Max: 160
  # Tabular data: one row per line is the readable form (kubectl column
  # definitions, the validation-oracle mapping, the protobuf pointer-field
  # table).  Wrapping the rows would hide the columns.
  Exclude:
    - 'lib/rubernetes/api/table_printer/columns.rb'
    - 'tools/milestones/m1_kubernetes_validation_oracle.rb'
    - 'lib/rubernetes/schema/codec/kubernetes_pointer_fields.rb'
  AllowURI: true
  AllowedPatterns:
    - '\A\s*#'
Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent
Layout/HashAlignment:
  EnforcedColonStyle: key
  EnforcedHashRocketStyle: key

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  EnforcedStyle: always
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: no_comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: no_comma

Metrics:
  Enabled: false

# v6, ipv4, sha256, rol32 are domain names, not numbered variables.
# Nested rescues name their exception distinctly on purpose (cleanup_error
# next to the original error); renaming them all to `error` shadowed the
# outer variable in 35 methods.
Naming/RescuedExceptionsVariableName:
  Enabled: false
# Heuristic on return values; `close` returning true is not a predicate.
Naming/PredicateMethod:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false
# Helpers that assert (create_x, setup_pool) are not tests; the autocorrect
# renamed six of them to test_* and broke their callers.
Minitest/TestMethodName:
  Enabled: false

# Cops whose autocorrect assumes concrete core types.  This tree passes
# duck-typed collections (Array/Headers/ListType where a Hash is expected,
# CPUSet where an Array is, String or nil where a number is) and custom
# exception constructors; batch-applying these on 2026-09-30 produced 249
# test failures (each_key on Array, zero? on String, intersect? on CPUSet,
# raise with three arguments).  They stay off rather than parked.
Style/HashEachMethods:
  Enabled: false
Style/NumericPredicate:
  Enabled: false
Style/ArrayIntersect:
  Enabled: false
Style/HashExcept:
  Enabled: false
Style/HashSlice:
  Enabled: false
Style/RaiseArgs:
  Enabled: false
Style/SafeNavigation:
  Enabled: false
Style/DoubleNegation:
  Enabled: false
Style/StringConcatenation:
  Enabled: false
# SelectByRegexp rewrote `select { |v| matcher.match?(v) }` into `grep(matcher)`
# where matcher is a Struct with its own match? (apps/dashboard tsdb): grep uses
# ===, so every regex label selector silently returned nothing (found 2026-10-01).
Style/SelectByRegexp:
  Enabled: false
# CombinableLoops merged two consecutive loops over the same hash into one
# although the first loop `next`s past some entries (apps/dashboard rules):
# ALERTS rows stopped being written for active alerts (found 2026-10-01).
Style/CombinableLoops:
  Enabled: false
# assert_equal true / refute_equal false assert an exact boolean on purpose.
Minitest/AssertTruthy:
  Enabled: false
Minitest/RefuteFalse:
  Enabled: false

# Judged not worth a tree-wide rewrite (2026-09-30), with the reason:
# - ChainArrayAllocation (1,095): `map.select.first` chains read better than
#   hand-fused loops; the arrays are small and never on a hot path we measured.
# - CollectionLiteralInLoop (93): hoisting every `%w[]` out of a loop trades
#   locality for a constant; the literals are tiny.
# - MultilineBlockChain (84) / DuplicateBranch (102): the branches and chains are
#   intentional for readability (parallel cases stay visibly parallel).
# - UselessConstantScoping (247): `private` never scoped constants; the
#   constants are referenced by tests and tools, so private_constant is wrong.
# - StructNewOverride (27): Struct members named count/size/hash are wire-field
#   names; renaming them would ripple through every caller and serializer.
# - NoReturnInBeginEndBlocks (28): every `return` inside an assigned begin/end
#   is meant to leave the method (early exit on a parse failure).
Performance/ChainArrayAllocation:
  Enabled: false
Performance/CollectionLiteralInLoop:
  Enabled: false
Style/MultilineBlockChain:
  Enabled: false
Lint/DuplicateBranch:
  Enabled: false
Lint/UselessConstantScoping:
  Enabled: false
Lint/StructNewOverride:
  Enabled: false
Lint/NoReturnInBeginEndBlocks:
  Enabled: false

# Unused keyword arguments are interface conformance (a plan(**options)
# contract shared by dozens of controllers); positional ones get the `_`.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
Lint/UnusedBlockArgument:
  AllowUnusedKeywordArguments: true
  IgnoreEmptyBlocks: true

# Decisions taken while burning down .rubocop_todo.yml (2026-10-01), each
# with the reason, so nobody re-litigates them by accident:
# - MethodParameterName MinNameLength 1: one-letter parameters are used where
#   they mirror the formula or spec being implemented (jhash a/b/c, APF r/s,
#   CEL type checker m/t1/t2, PromQL q/t, eBPF assembler a); longer names
#   would move the code away from its reference.
# - FormatStringToken off: the format strings are table layouts in tools
#   (`%-20s %6d`); annotated tokens make those rows harder to read.
# - AssertWithExpectedArgument off: the second argument of these asserts is
#   always a computed failure message (`errors.inspect`); assert_equal is
#   used wherever a value is expected.
# - VariableNumber AllowedPatterns: trailing numbers after an underscore are
#   Kubernetes versions (check_1_25), HTTP codes (_with_408) and modes (_0644).
# - MethodName: camelCase names are Kubernetes wire fields (resourceVersion)
#   and CEL library functions (isInteger); Boolean() is a conversion function
#   like Kernel#Integer.
# - Security/Open: PathSecurity and Openat2 define their own `open`.
# - AccessorMethodName off: set_* here names an action with side effects
#   (setns-style kernel calls, metric sets), not an attribute writer.
# - FloatComparison off: exact float comparisons mirror upstream (PromQL
#   bool modifier, quantity rendering `value.round == value`).
# - OneClassPerFile off: probe scripts keep their helper classes with their
#   only user; splitting them adds files without adding clarity.
# - MissingSuper in test/: test doubles replace the parent's state wholesale.
# - LineLength 160: measured 2026-10-01, the median over-long line was 157
#   columns; 140 would have meant wrapping two thousand lines by hand.
Naming/MethodParameterName:
  MinNameLength: 1
Style/FormatStringToken:
  Enabled: false
Minitest/AssertWithExpectedArgument:
  Enabled: false
Naming/VariableNumber:
  EnforcedStyle: normalcase
  AllowedPatterns:
    - '_\d+(_\d+)*\z'
Naming/MethodName:
  AllowedPatterns:
    - '\A(resourceVersion|remainingItemCount|vendorVersion|pluginVersion|Boolean)\z'
  Exclude:
    - 'lib/rubernetes/security/cel/library.rb'
Security/Open:
  Exclude:
    - 'lib/rubernetes/volume/path_security.rb'
    - 'lib/rubernetes/platform/linux/openat2.rb'
Naming/AccessorMethodName:
  Enabled: false
Lint/FloatComparison:
  Enabled: false
Style/OneClassPerFile:
  Enabled: false
Lint/MissingSuper:
  Exclude:
    - 'test/**/*'
# ComparableClamp off: Comparable#clamp raises when min > max, and several of
# the `[[x, lo].max, hi].min` sites have data-dependent bounds that can
# invert (HPA scale policies, APF seat limits, webhook timeouts).
Style/ComparableClamp:
  Enabled: false
# FileOpen off: the block-less File.open calls hold a descriptor on purpose
# (directory handles for fsync, namespace and tun fds handed to children,
# lock files) and every one of them is closed in an ensure.
Style/FileOpen:
  Enabled: false
# Unsafe autocorrects tried on 2026-10-01 that changed behaviour; off with the reason:
# - AccessModifierDeclarations: `public def` / `private def` keep the
#   visibility next to the method on purpose; the group-form autocorrect
#   moved methods across the class and dedented them.
# - MemoizedInstanceVariableName: the `||=` sits in a non-accessor method and
#   the ivar is read elsewhere under its own name; renaming it broke callers.
# - InefficientHashSearch / ZeroLengthPredicate / Performance/Count: the
#   receivers are Structs, CPUSets and File::Stat, which have `values`,
#   `count` and `size` but no `value?`, `none?` or `empty?`.
# - PartitionInsteadOfDoubleSelect: select/reject on a Hash keep Hashes,
#   partition returns two Arrays of pairs.
# - Lint/PercentStringArray: the "stray" commas inside %w[] are test inputs.
Style/AccessModifierDeclarations:
  Enabled: false
Naming/MemoizedInstanceVariableName:
  Enabled: false
Performance/InefficientHashSearch:
  Enabled: false
Style/ZeroLengthPredicate:
  Enabled: false
Performance/Count:
  Enabled: false
Style/PartitionInsteadOfDoubleSelect:
  Enabled: false
Lint/PercentStringArray:
  Enabled: false
# CollectionQuerying off: `mask.count.zero?` / `affinity.count == 1` are on
# CPUSet bitmasks, which have count but no none?/one?.
Style/CollectionQuerying:
  Enabled: false

